name: Lazarius Career Agent (Gmail)

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  career-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r career-agent/requirements-gmail.txt

      - name: Run Gmail agent
        working-directory: career-agent
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER_EMAIL: ${{ secrets.GMAIL_USER_EMAIL }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          CV_BASE64: ${{ secrets.CV_BASE64 }}
          LETTER_BASE64: ${{ secrets.LETTER_BASE64 }}
          DAILY_LIMIT: '20'
          AUTO_SEND: 'false'
        run: python gmail_runner.py
